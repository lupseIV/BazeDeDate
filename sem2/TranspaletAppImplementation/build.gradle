plugins {
    id 'java'
    id 'application'
    id ("org.openjfx.javafxplugin").version("0.1.0")
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    implementation 'com.microsoft.sqlserver:mssql-jdbc:13.3.2.jre11-preview' // Or latest version

    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc_auth:12.6.1.x64'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application{
    mainClass = 'org.example.Application'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

jar{
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('mainClass' : 'Application')
    }
    from {
        configurations.runtimeClasspath.collect{it.isDirectory() ? it : zipTree(it)}
    }
}

test {
    useJUnitPlatform()
}